openapi: 3.1.0
info:
  title: MailCare Platform API Gateway
  version: 1.0.0
  description: >
    Cloud-native, API-first, Event-driven Email Cleaning & Data Hygiene Platform REST API (Sec. 4, 20, 21, 39).
    Enforces TLS 1.2+ (NFA-16), OAuth 2.0 / API-Key Auth (NFA-15), Multi-Tenant organization_id isolation (NFA-22),
    Token-Bucket Rate Limiting (Sec. 29), and Idempotency-Key deduplication (NFA-10).
servers:
  - url: https://api.mailcare.io/v1
    description: Production Multi-AZ API Gateway
  - url: http://localhost:3000/api/v1
    description: Local Integrated Gateway
  - url: http://localhost:4000/v1
    description: Standalone Node.js API Gateway Service

components:
  securitySchemes:
    OAuth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    EnterpriseApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    OrganizationIdHeader:
      name: X-Organization-Id
      in: header
      required: true
      schema:
        type: string
      description: Multi-tenant boundary identifier (NFA-22)
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Prevents duplicate side-effects on retry (NFA-10)
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, trace_id]
          properties:
            code:
              type: string
              enum:
                - RATE_LIMITED
                - SYNTAX_ERROR
                - TENANT_FORBIDDEN
                - PASSWORD_AUTH_PROHIBITED
                - UNAUTHORIZED
                - ML_SERVICE_UNAVAILABLE
            message:
              type: string
            retry_after:
              type: integer
            request_id:
              type: string
            trace_id:
              type: string

paths:
  /auth:
    get:
      summary: Discover delegated OAuth 2.0 / OIDC providers (NFA-15 Passwordless Only)
      responses:
        "200":
          description: Delegated OAuth configuration
  /accounts:
    get:
      summary: Retrieve tenant account quotas and configurable retention policies (NFA-46)
      responses:
        "200":
          description: Account and retention metadata
  /mailboxes:
    get:
      summary: List connected OAuth consumer mailboxes and storage-recovery metrics (Sec. 6, 33)
      responses:
        "200":
          description: Connected mailboxes list
  /mailboxes/{mailboxId}/messages:
    get:
      summary: Query indexed message metadata (no raw bodies persisted - NFA-14)
      parameters:
        - name: mailboxId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paginated message metadata
  /mailboxes/{mailboxId}/bulk-actions:
    post:
      summary: Queue asynchronous bulk archive/delete/quarantine job for mailbox (Sec. 9)
      parameters:
        - name: mailboxId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Consumer bulk job queued on consumer.mutations
  /messages:
    get:
      summary: Search normalized message metadata and sender/domain clusters (Sec. 7, 8)
      responses:
        "200":
          description: Message metadata clusters
  /threads:
    get:
      summary: Query conversation thread groupings and physical size analytics (Sec. 7)
      responses:
        "200":
          description: Thread size distribution
  /rules:
    get:
      summary: List structured deterministic filtering rules (Sec. 11)
      responses:
        "200":
          description: Active mailbox rules
    post:
      summary: Create a structured filtering rule
      responses:
        "201":
          description: Rule created
  /bulk-actions:
    post:
      summary: Create asynchronous bulk inbox mutation job (10,000+ messages - NFA-04)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Job created on consumer.mutations
  /unsubscribe:
    post:
      summary: Execute RFC 8058 one-click unsubscribe and emit immutable audit record (Sec. 10)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Unsubscribe job queued on consumer.unsubscribe
  /verify:
    post:
      summary: Real-time single email verification (<1.5s SLA - Sec. 20, NFA-03)
      responses:
        "200":
          description: Versioned immutable verification result (NFA-52)
        "422":
          description: Early syntax termination (Stage 1)
  /verification:
    post:
      summary: Alias for /v1/verify real-time verification (Sec. 39)
      responses:
        "200":
          description: Verification result
  /verification/jobs:
    get:
      summary: List asynchronous enterprise verification batch jobs
      responses:
        "200":
          description: Batch jobs list
    post:
      summary: Upload CSV/TXT/XLSX for partitioned 10k-chunk verification (Sec. 21, NFA-08, NFA-50)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          description: Partitioned batch job created
  /verification/jobs/{jobId}:
    get:
      summary: Inspect batch job checkpoint progress and partition states (NFA-11)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkpoint status
  /contacts:
    get:
      summary: List enterprise contact hygiene records and suppression status
      responses:
        "200":
          description: Contact hygiene directory
  /integrations:
    get:
      summary: List CRM and ESP adapter configurations (Sec. 25, NFA-35)
      responses:
        "200":
          description: Connected CRM/ESP adapters
  /webhooks:
    get:
      summary: List HMAC-SHA256 at-least-once webhook subscriptions (Sec. 26, NFA-37)
      responses:
        "200":
          description: Webhook subscriptions
  /monitoring:
    get:
      summary: Retrieve Multi-AZ HA status, DB replica health, queue depths, and SLA metrics (Sec. 32, NFA-40)
      responses:
        "200":
          description: Operational telemetry
  /audit:
    get:
      summary: Query immutable chronological audit events (Sec. 34, NFA-53)
      responses:
        "200":
          description: Immutable audit log
