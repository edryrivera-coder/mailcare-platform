version: "3.9"

# ============================================================================
# MAILCARE LOCAL DEVELOPMENT INFRASTRUCTURE (Sec. 23, 38, 43)
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: mailcare-postgres
    environment:
      POSTGRES_USER: mailcare
      POSTGRES_PASSWORD: mailcare_dev_only
      POSTGRES_DB: mailcare
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mailcare-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: mailcare-object-store
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mailcare_minio
      MINIO_ROOT_PASSWORD: mailcare_minio_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
